derivation:
  spec: RATE §6
  unit: per-conversation RATE of each marked label over ALL T turns
  estimator: raw counts / T on BOTH sides; no smoothing anywhere (C7)
  eligibility: T >= 10 turns — a LENGTH rule, never a marked-count rule (§6 step 2,
    the §1.6 fix)
  percentile_window:
    P_lo: 25.0
    P_hi: 75.0
    declared_choice: 25th-75th targets the middle half of conversations that lean
      the intended way. This is a DESIGN DECISION, not a measurement (§6.1); changing
      it needs its own justification, not a retune.
  grouping:
    low_rate_ceiling: 0.1
    precedence: low-rate tested FIRST, then lean by p_a > p_b — §6 step 4's three
      predicates overlap as written; see rate_derive.group_conversations for the argument.
  anti_caricature: the on-direction band's UPPER EDGE, and nothing else (§5.3). Off-direction
    bands have no lower edge because the measured 25th percentile of the off-direction
    rate is 0.000.
  shoulders: symmetric, s = 0.06 (§5.1)
  scenario_dependence: 'EVERY component is scenario-dependent (§10). The conditional
    ratio''s scenario-invariance is given up deliberately: it was an argument, never
    a measurement, and six measured failures sit against it. AnnoMI is MI counselling,
    not layoff support; the counselling-to-layoff gap is a standing limitation on
    BOTH axes.'
  precision: at a true rate of 0.20 the 95% interval on a single 20-turn arc runs
    roughly 0.02-0.38. No individual arc's rate is a measurement (§10).
  source: TRANSCRIBED from RATE §7 (no label cache on this host)
  source_note: 'Transcribed from RATE §7, not re-derived: the grader label cache those
    percentiles were read off is not in this repo. Two disclosures travel with these
    numbers. (1) §7''s group sizes sum to 115 over 100 eligible conversations, so
    the source run''s groups OVERLAP; §6 step 4 says ''partition'' and rate_derive.group_conversations
    implements the disjoint version with low-rate tested first, so a re-derivation
    will shift these edges. (2) §7 flags the §5.2 widening on EXTERNALIZING p_int
    in [0, 0.071] but not on the equally sub-span INTERNALIZING p_ext in [0, 0.089]
    or either NEUTRAL band; it is applied uniformly here and recorded per band.'
