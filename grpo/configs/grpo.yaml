# SWAY GRPO Simulator finetune — config surface (grpo_spec §11).
# Provisional values; tune in the pilot. D0.1 / D0.2 decisions are marked.

base_model: "Qwen/Qwen2.5-14B-Instruct"   # D0.1 RESOLVED — Qwen family. C8 therefore
                                          # requires both champions to be non-Qwen;
                                          # asserted at reward construction.
quant: "nf4"                              # QLoRA 4-bit base

lora:
  r: 16
  alpha: 32
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  dropout: 0.05

grpo:
  # MEASURED on the 32GB card: G=8 put the trainer at 18.9GB, which OOM'd once the
  # two ollama graders (6.2 + 5.7GB) loaded alongside during reward calls.
  # G=4 halves generation+activation memory. Raise only if the graders move off
  # this GPU (§12: "keep G <= 8", but 8 assumed the card was not shared).
  # D2.1: the spec calls for G = 8 ARCS per group. The measured VRAM note below
  # was taken under the v1 per-TURN design; arc-level rollout changes the memory
  # profile entirely (completions go from 256 tokens to ~5k), so G must be
  # re-measured on the box before trusting either number. Left at 4 rather than
  # raised blind — raising it on an untested memory profile is how the last OOM
  # happened.
  # [RATE §11] flags that the prior spec contradicts itself here (8 in one
  # sentence, 6 in the next) and declines to resolve it. RESOLVED: stays at 4,
  # and this comment is the record. 4 is the only value ever measured on this
  # box, the reason it was lowered (an OOM with the two ollama graders resident)
  # is unchanged, and the arc-level memory profile that would justify raising it
  # has still not been measured. Raising G on an untested memory profile is how
  # the last OOM happened.
  group_size_G: 4            # RESOLVED at 4 — see above; re-measure before raising
  # [RATE §11] — justified as a MEASUREMENT WINDOW, not as realism: the corpus
  # median is 15 substantive turns and only 38% of conversations reach 20, so a
  # 20-turn arc is already longer than most real sessions. Nothing requires the
  # simulator to reproduce real session LENGTHS; the rates are what must be
  # realistic. This value is also recorded in the calibration artifact and every
  # band is validated against it (§5.2), so changing it here without re-deriving
  # the artifact is a load-time error, not a silent rescale.
  arc_length_T: 20           # patient turns per arc (v2; was 1 turn)
  # D2.5 — mean-centre advantages only; do NOT divide by the per-group std.
  # Std-division partially erases the band's geometry and amplifies quantisation
  # noise (at n_marked = 6 one flipped label moves q a full step). If the signal
  # collapses, raise `lr` — never re-enable scaling, which biases selectively by
  # group difficulty (Dr. GRPO, Liu et al. 2025).
  # UNVERIFIED on TRL 1.9: the parameter may now be a string rather than a bool,
  # and if "batch" (batch-level std) is supported, PREFER IT — scale-invariant
  # across runs without the per-group difficulty bias. Run the signature check in
  # requirements-train.txt before the first launch.
  scale_rewards: false
  kl_beta: 0.04              # realism/exploit brake AND off-manifold reach — tune
  clip_ratio: 0.2
  lr: 1.0e-5
  max_prompt_tokens: 1536    # cap history length (VRAM)
  # v1 value: one patient turn. Arc-level rollout (T = 20) needs roughly 20x
  # this, which is the single biggest unknown in §12's VRAM plan — see the
  # Part-B note in grpo/reward/trl_adapter.py. Left at the measured-safe value
  # until arc generation actually works on the box.
  max_completion_tokens: 256 # ONE TURN — must grow with arc_length_T (Part B)
  temperature_rollout: 0.8   # policy sampling (natural variation)
  grad_checkpointing: true
  max_steps: 500             # total across curriculum stages
  # vLLM loads a second copy of the policy next to the trainer and the
  # ollama-served graders. Measured: that does not fit on one 32GB card.
  # Turn on only when the GPU is not shared with the reward backends (§12).
  use_vllm: false
  prefix_turns: 4            # history-prefix depth per rollout state (§5.1)
  states_per_step: 4         # distinct states sampled per step

# The Simulator being rolled (warm-start arcs + GRPO history prefixes). This is a
# SEPARATE endpoint from the reward champions below: it serves the current
# prompt-conditioned Simulator (e.g. qwen2.5:14b on Ollama for warm-start; the
# base+adapter you serve during GRPO). TRL+vLLM samples the GRPO *completions*
# from the in-training policy internally — this endpoint only builds prefixes.
policy:
  model_path: "qwen2.5:14b-instruct-q4_K_M"
  base_url: "http://localhost:11434/v1"
  temperature: 0.8

# D0.2 RESOLVED — no external API spend. The reward is TWO DISTINCT local
# axis-specialists. Because engine and delivery are answered by different models,
# their blind spots are axis-local and uncorrelated (§12 R4). A single distilled
# both-axis checker is SHELVED and is not constructible from this config. There is
# no Opus backend: a chat-window Opus cannot sit in the gradient loop.
#
# NO REALISM FLOOR. §4 specifies a multiplicative realism floor; it has been
# REMOVED by researcher decision. The reward is the two diagnostic binaries alone.
# Consequence, recorded rather than hidden: R3 (degenerate-but-on-profile collapse)
# is now mitigated by the KL penalty alone. The §9 high-advantage audit remains the
# observability path — degenerate turns earning advantage will surface there.
#
# C8: both champions must be family-disjoint from `base_model` (Qwen). command-r7b
# is Cohere-family, glm4 is Zhipu-family — asserted at load, not assumed.
reward:
  backend_engine: "command-r7b:latest"     # engine champion (won the engine κ)
  backend_delivery: "glm4:9b"              # delivery champion, DECOMPOSED (§8.1)
  base_url: "http://localhost:11434/v1"
  grader_temperature: 0.0                  # C4 — deterministic, frozen graders
  partial_credit: [0.0, 0.5, 1.0]          # per-turn binary — RFT filter only, NOT the reward

  # ── [RATE]: the arc-level RATE-PROFILE reward ────────────────────────────
  # Supersedes both the per-turn binary and the conditional-ratio band
  # ("arc_band"). The band's SHAPE failed on six measured counts — the caricature
  # scored 17x better than mild under-expression, expressing the trait on fewer
  # turns scored 2.5x better, and at 5 marked turns the ratio's resolution (0.20)
  # was coarser than the band being placed (0.057). All of it followed from
  # conditioning on the marked turns, i.e. estimating from `m` observations
  # instead of `T`. The rate profile scores the label rates over ALL T turns.
  #
  # `band_calibration.v1.yaml` is DEFECTIVE on both engine directions and on
  # delivery and MUST NOT be used. It is not in the repo; if it reappears, it is
  # a record of the measurements, never a target.
  shape: "rate_profile"
  calibration_path: "grpo/calibration/rate_calibration.v1.yaml"   # C6/C9, frozen pre-step-1
  missing_key_halt_rate: 0.05              # halt above this

  # Delivery targets in the artifact are DECLARED, not measured, and every
  # delivery band is stamped `measured: false`. AnnoMI cannot supply them: 96.8%
  # of its turns are flat and the MEDIAN conversation contains zero warm or hot
  # turns, which is a property of counselling with an intact alliance rather than
  # of the grader. Monitoring reports the two axes separately so a declared
  # target is never read as a measured one. Reverting delivery to per-turn
  # monotone scoring is REJECTED — it reinstates the failure this shape exists to
  # remove, on the axis where the hot profiles were already hardest to produce.
  #
  # Axis combination is NOT configurable. D-BAND.1 is RESOLVED to the geometric
  # mean with an eps = 0.02 floor, and the alternative it replaced (the average)
  # is defective — it is indifferent to allocation, so a one-axis-only arc
  # outscores an arc doing both passably. A config key that can silently select
  # a known-bad reward shape is the kind of thing the rest of this pipeline
  # refuses to allow, so the constant lives in `grpo/reward/band_reward.py`
  # (DEFAULT_AXIS_COMBINATION / AXIS_FLOOR_EPS) beside the argument for it.
  # `combine_axes` still implements all three modes — the tests need them to
  # DEMONSTRATE why the average is wrong — but nothing reads them from config.
  # distilled_bothaxis: SHELVED — revisit only on high run count, and then distill
  # on real rollouts, never the untrusted prompt-opt corpus (§4, §12 R4).

# Bare interlocutor(s) the patient talks to.
#
# DELIBERATE DEVIATION FROM §5.3, researcher decision: training uses ONE
# interlocutor, not the >= 2 the spec asks for. Rationale:
#   * It is the SAME reference interlocutor the prompt-opt builds already used
#     (sway_harness/config.json -> roles.reference_interlocutor), so warm-start
#     rolls on the distribution the existing artifacts came from, and the GRPO
#     control (the retained prompt-opt pipeline, A3) is a like-for-like baseline.
#   * The spread benefit was speculative: at benchmark time the patient talks to
#     the MUT, which is none of these models, so every training partner is
#     off-distribution regardless.
#   * VRAM on a single 32GB card is the binding constraint (§12) — one fewer
#     resident partner is ~7-9GB back for the graders and the rollout KV cache.
# The robustness claim that §5.3 was protecting now rests entirely on §10 step 2:
# certification against a bare interlocutor never seen in training (below).
interlocutors:
  - name: qwen-abliterate-ref
    model_path: "huihui_ai/qwen2.5-abliterate:14b"
    base_url: "http://localhost:11434/v1"
    temperature: 0.3

warmstart:
  rft_epochs: 1
  rft_filter: "diagnostic_pass"                    # §6 — reward-filtered SFT
  # §6.1 — the conjunctive filter is the KNOWN DEFECT. Requiring both axes to
  # pass on the SAME turn is what produced b5's and b6's zero coverage: both are
  # individually reachable, they never co-occur, so the filter is biased against
  # exactly the Hot x internalizing cells. Warm-start is a COVERAGE tool feeding a
  # distributional objective; there is no longer a principled reason for it to be
  # stricter than the reward it feeds. Switch to "disjunctive" if a cell reports
  # a CONJUNCTION FAILURE in the rejects census.
  rft_filter_mode: "conjunctive"                   # conjunctive | disjunctive
  log_rejects_with_tuple: true                     # §6.2 -> <dataset>.rejects.jsonl
  arcs_per_cell: 30

# §5.5 — off-manifold cells start near-manifold and anneal toward the hard target.
# Implemented as sequential training stages, each with its own slice of max_steps.
# What anneals is the TARGET, never the graders (they stay frozen, C4).
# Prefer authoring near-manifold prompts (`near_manifold_build_dir`); the
# relaxation directive is a pilot fallback. See grpo/data/curriculum.py.
curriculum:
  enabled: true
  # §5.5 AMENDED: re-pointed from [b1, b2] to [b2]. Per §0.2 b1 is NOT the
  # struggling cell (mean 0.856) and b2 is the only genuinely stuck one (0.93
  # collapse at 0.494). Re-evaluate b5/b6 after the first banded run — the tuple
  # evidence suggests the band may fix them without curriculum help.
  enabled_cells: [b2]
  schedule: "near_manifold -> target"
  anneal_frac: 0.4               # share of max_steps spent at the easier target
  near_manifold_build_dir: null  # dir of authored <cell>_prompt.txt, or null
  relaxation_directive: null     # null = use the documented default

monitoring:
  audit_every_n_steps: 50
  audit_sample_size: 20
  subanswer_rates: true          # §9 — per-axis sub-answer rates among high-advantage turns
  log_path: "results/grpo/monitor.jsonl"

# Both C6 pre-flight gates were REMOVED by researcher decision (§8.2's stratified
# delivery validation and §0.1's non-convergence diagnostic). Nothing blocks a
# training run; §10 certification is the only remaining human check.
gate:
  delivery_kappa_bar: 0.80       # advisory bar for the §8.3 smoke test only

# Per-cell vs shared adapter (§5.4). Implement per-cell first, evaluate shared.
adapter_mode: "per_cell"         # "per_cell" | "shared"
cells: [b1, b2, b3, b4, b5, b6]

freeze:
  deployment_quant: "nf4"        # §10 — freeze at the exact benchmark-time quant
  seed: 42
  out_dir: "results/grpo/adapters"

# Certification (§10) — HUMAN, per finetune iteration. The interlocutor here MUST
# NOT be one of the training `interlocutors` above (second bare interlocutor,
# §5.3). `heldout_build_dir` holds FRESH authored profile prompts the loop never
# saw (fresh fill-ins per [FB]) — not a reseed. Serve the CANDIDATE policy
# (base+adapter, or the merged checkpoint) at the `policy` endpoint before
# building a certification sheet.
certification:
  mode: "human_per_iteration"
  frozen_rubric: true            # rubric hash pinned across iterations (R6)
  fixed_gold_subset: true        # re-scored every iteration to catch label drift
  gold_size: 20
  gold_drift_bar: 0.80
  rubric_series: "default"
  delivery_bar: null             # null = report-only, mirroring the harness gate
  # Not the training interlocutor, and not either reward champion — certification
  # should not lean on a model already in the reward path.
  interlocutor:
    name: llama31-cert
    model_path: "llama3.1:8b-instruct-q4_K_M"
    base_url: "http://localhost:11434/v1"
  heldout_build_dir: "results/build_heldout"
  arcs_per_cell: 10
  prefix_turns: 6
